<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahradní projekt - master dashboard</title>
  <style>
:root {
  --cream: #f7efe3;
  --sand: #ead7bd;
  --wood-light: #d3b58f;
  --ink: #2d241b;
  --muted: #66584b;
  --brown: #6f5138;
  --brown-deep: #2d241b;
  --green: #5a8f55;
  --orange: #b98228;
  --red: #a64d3f;
  --blue-gray: #4f7480;
  --glass: rgba(255, 255, 255, 0.28);
  --glass-strong: rgba(255, 255, 255, 0.42);
  --glass-soft: rgba(255, 255, 255, 0.18);
  --line: rgba(255, 255, 255, 0.56);
  --line-dark: rgba(82, 62, 43, 0.12);
  --shadow-section: 0 28px 80px rgba(70, 49, 30, 0.16);
  --shadow-card: 0 18px 48px rgba(70, 49, 30, 0.11);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  font-family: Inter, Arial, sans-serif;
  color: var(--ink);
  background:
    linear-gradient(145deg, rgba(247, 239, 227, 0.92), rgba(234, 215, 189, 0.86) 46%, rgba(218, 204, 182, 0.92)),
    linear-gradient(90deg, rgba(111, 81, 56, 0.1), rgba(90, 143, 85, 0.08));
  background-attachment: fixed;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  background: rgba(247, 239, 227, 0.45);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: 0 12px 34px rgba(70, 49, 30, 0.08);
}

.nav {
  display: flex;
  gap: 12px;
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px 22px;
  overflow-x: auto;
}

.nav a {
  flex: 0 0 auto;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  color: var(--ink);
  text-decoration: none;
  font-weight: 850;
  font-size: 14px;
  line-height: 1;
  padding: 12px 16px;
  border: 1px solid rgba(255, 255, 255, 0.64);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
  transition: background 180ms ease, box-shadow 180ms ease, color 180ms ease;
}

.nav a:hover {
  background: rgba(255, 255, 255, 0.52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px rgba(70, 49, 30, 0.1);
}

main {
  width: min(1500px, calc(100% - 44px));
  margin: 0 auto;
  padding: 38px 0 72px;
}

.section {
  position: relative;
  scroll-margin-top: 92px;
  margin: 0 0 34px;
  padding: clamp(26px, 3vw, 44px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 32px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.18));
  backdrop-filter: blur(26px) saturate(135%);
  box-shadow: var(--shadow-section), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.section::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
  pointer-events: none;
}

.hero-section {
  min-height: min(720px, calc(100vh - 96px));
  display: grid;
  align-content: center;
  gap: 30px;
}

.hero-copy {
  max-width: 980px;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--brown);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 13px;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

h1 {
  max-width: 1060px;
  margin: 0;
  font-size: clamp(40px, 5.6vw, 76px);
  line-height: 1.02;
  letter-spacing: 0;
}

h2 {
  margin: 0 0 28px;
  font-size: clamp(28px, 3vw, 44px);
  line-height: 1.12;
  letter-spacing: 0;
}

h3 {
  margin: 18px 0 14px;
  font-size: 21px;
  line-height: 1.28;
  letter-spacing: 0;
}

p {
  line-height: 1.65;
}

.hero-intro,
.section-intro {
  max-width: 960px;
  color: var(--muted);
  font-size: 18px;
}

.section-intro {
  margin-top: -12px;
  margin-bottom: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 20px;
  margin-top: 24px;
}

.card,
.progress-panel,
.total-box,
.missing-list li {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass-soft));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.card {
  min-height: 168px;
  padding: 24px;
  transition: background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.74);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.22));
  box-shadow: 0 22px 58px rgba(70, 49, 30, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.76);
}

.card p:last-child,
.section p:last-child {
  margin-bottom: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 8px 13px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  font-weight: 900;
  font-size: 13px;
}

.badge.good {
  background: linear-gradient(135deg, var(--green), #3f7043);
}

.badge.wait {
  background: linear-gradient(135deg, var(--orange), #8f651f);
}

.badge.risk {
  background: linear-gradient(135deg, var(--red), #7c382f);
}

.badge.split {
  background: linear-gradient(135deg, var(--blue-gray), #365965);
}

.amount {
  margin: 10px 0 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 900;
}

.button {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  margin-top: 14px;
  padding: 12px 18px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: 0 14px 30px rgba(45, 36, 27, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  text-decoration: none;
  font-weight: 900;
  transition: box-shadow 180ms ease, background 180ms ease;
}

.button:hover {
  background: linear-gradient(135deg, #7d5d42, var(--brown-deep));
  box-shadow: 0 18px 36px rgba(45, 36, 27, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.table-wrap {
  margin-top: 28px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
}

table {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
}

th,
td {
  padding: 16px 15px;
  border-bottom: 1px solid var(--line-dark);
  text-align: left;
  vertical-align: top;
  line-height: 1.5;
}

th {
  background: rgba(255, 255, 255, 0.26);
  color: var(--brown-deep);
  font-size: 14px;
}

tr:last-child td {
  border-bottom: 0;
}

.total-row td {
  font-weight: 900;
  background: rgba(111, 81, 56, 0.1);
}

.totals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 20px;
  margin-top: 22px;
}

.total-box {
  padding: 22px;
}

.total-box span {
  display: block;
  color: var(--muted);
  font-size: 14px;
  font-weight: 850;
}

.total-box strong {
  display: block;
  margin-top: 9px;
  font-size: 28px;
}

.clean-list,
.missing-list,
.checklist {
  padding-left: 0;
  list-style: none;
}

.clean-list li,
.missing-list li {
  margin: 10px 0;
}

.missing-list {
  display: grid;
  gap: 16px;
  max-width: 960px;
  margin-top: 22px;
}

.missing-list li {
  margin: 0;
  padding: 18px 20px;
}

.progress-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 26px;
  align-items: center;
  padding: 24px;
  margin-top: 22px;
}

.progress-track {
  height: 24px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.62);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 8px rgba(45, 36, 27, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brown), #9b7654);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
  transition: width 240ms ease;
}

.progress-number {
  margin: 0;
  font-size: 42px;
  line-height: 1;
  font-weight: 900;
}

.checklist {
  display: grid;
  gap: 14px;
  margin: 0;
}

.checklist label {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 13px;
  align-items: start;
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.48);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.48);
}

.checklist input {
  appearance: none;
  width: 24px;
  height: 24px;
  margin: 0;
  border: 2px solid rgba(111, 81, 56, 0.5);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
}

.checklist input:checked {
  border-color: var(--brown);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, 0.86) 47% 56%, rgba(255, 255, 255, 0) 57%),
    linear-gradient(45deg, rgba(255, 255, 255, 0) 37%, rgba(255, 255, 255, 0.86) 38% 49%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(135deg, var(--brown), var(--brown-deep));
}

.checklist input:focus-visible {
  outline: 3px solid rgba(111, 81, 56, 0.24);
  outline-offset: 3px;
}

.checklist input:checked + span {
  color: var(--muted);
  text-decoration: line-through;
}

@media (max-width: 760px) {
  main {
    width: min(100% - 24px, 1500px);
    padding: 22px 0 46px;
  }

  .nav {
    gap: 9px;
    padding: 12px;
  }

  .nav a {
    min-height: 40px;
    padding: 11px 14px;
  }

  .section {
    margin-bottom: 22px;
    padding: 24px;
    border-radius: 28px;
  }

  .hero-section {
    min-height: auto;
  }

  h1 {
    font-size: 38px;
  }

  .card,
  .progress-panel,
  .total-box,
  .missing-list li {
    border-radius: 24px;
  }

  .progress-panel {
    grid-template-columns: 1fr;
  }

  .progress-number {
    font-size: 34px;
  }
}

  </style>
</head>

  <script>
(function () {
  const data = window.ZAHRADA_DASHBOARD;
  const checklistStorageKey = "zahrada-checklist-v1";

  const savedChecklist = readSavedChecklist();

  function text(value) {
    return String(value ?? "");
  }

  function el(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function badge(label, tone) {
    const node = el("span", `badge ${tone || ""}`.trim(), label);
    return node;
  }

  function card(item) {
    const node = el("article", "card");
    node.append(badge(item.badge, item.tone));
    node.append(el("h3", "", item.title));
    if (item.amount) node.append(el("p", "amount", item.amount));
    if (item.body) node.append(paragraphs(item.body));
    return node;
  }

  function summaryCard(tuple) {
    const [label, tone, title, amount, body] = tuple;
    return card({ badge: label, tone, title, amount, body });
  }

  function paragraphs(value) {
    const wrapper = document.createDocumentFragment();
    text(value)
      .split("\n")
      .filter(Boolean)
      .forEach((line) => wrapper.append(el("p", "", line)));
    return wrapper;
  }

  function grid(items, renderItem) {
    const node = el("div", "grid");
    items.forEach((item) => node.append(renderItem(item)));
    return node;
  }

  function sectionTitle(section, title, intro) {
    section.replaceChildren();
    section.append(el("h2", "", title));
    if (intro) section.append(el("p", "section-intro", intro));
  }

  function table(headers, rows, total) {
    const wrap = el("div", "table-wrap");
    const tableEl = document.createElement("table");
    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    headers.forEach((header) => headerRow.append(el("th", "", header)));
    thead.append(headerRow);
    tableEl.append(thead);

    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      row.forEach((cell) => tr.append(el("td", "", cell)));
      tbody.append(tr);
    });

    if (total) {
      const tr = document.createElement("tr");
      tr.className = "total-row";
      total.forEach((cell) => tr.append(el("td", "", cell)));
      tbody.append(tr);
    }

    tableEl.append(tbody);
    wrap.append(tableEl);
    return wrap;
  }

  function renderNav() {
    const nav = document.querySelector("#mainNav");
    data.nav.forEach(([id, label]) => {
      const link = el("a", "", label);
      link.href = `#${id}`;
      nav.append(link);
    });
  }

  function renderOverview() {
    const section = document.querySelector("#overview");
    section.replaceChildren();
    const titleWrap = el("div", "hero-copy");
    titleWrap.append(el("p", "eyebrow", "Aktuální stav projektu"));
    titleWrap.append(el("h1", "", data.title));
    titleWrap.append(el("p", "hero-intro", data.intro));
    section.append(titleWrap);
    section.append(grid(data.overview, card));
  }

  function renderDocuments() {
    const section = document.querySelector("#docs");
    sectionTitle(section, "🔗 Rozcestník dokumentů a odkazů");
    section.append(
      grid(data.documents, (item) => {
        const node = el("article", "card");
        node.append(el("h3", "", item.title));
        if (item.body) node.append(el("p", "", item.body));
        if (item.href) {
          const link = el("a", "button", `${item.label} ↗`);
          link.href = item.href;
          link.target = "_blank";
          link.rel = "noreferrer";
          node.append(link);
        }
        return node;
      })
    );
  }

  function renderBudget() {
    const section = document.querySelector("#budget");
    sectionTitle(section, "💰 Rozpočet a známé náklady");
    section.append(grid(data.budget.cards, summaryCard));
    section.append(table(["Položka", "Částka", "Stav"], data.budget.rows, data.budget.totals[0]));

    const totals = el("div", "totals");
    data.budget.totals.forEach(([label, amount]) => {
      const item = el("div", "total-box");
      item.append(el("span", "", label));
      item.append(el("strong", "", amount));
      totals.append(item);
    });
    section.append(totals);
  }

  function renderWorkCosts() {
    const section = document.querySelector("#work-costs");
    sectionTitle(section, "👷 Kompletní výpočet práce Ivanovy party", data.workCosts.note);
    section.append(grid(data.workCosts.cards, summaryCard));
    section.append(table(data.workCosts.headers, data.workCosts.rows, data.workCosts.total));
  }

  function renderWorklog() {
    const section = document.querySelector("#worklog");
    sectionTitle(section, "📒 Stavební deník");
    section.append(
      grid(data.worklog, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderSettlement() {
    const section = document.querySelector("#settlement");
    sectionTitle(section, "🤝 Společné náklady s Lofflemanovými", data.settlement.intro);
    section.append(grid(data.settlement.cards, summaryCard));
    section.append(table(data.settlement.headers, data.settlement.rows, data.settlement.total));
    section.append(grid(data.settlement.breakdown, summaryCard));
  }

  function renderProjects() {
    const section = document.querySelector("#projects");
    sectionTitle(section, "✅ Projektové sekce");
    section.append(
      grid(data.projects, (item) => {
        const node = el("article", "card");
        node.append(el("h3", "", item[0]));
        if (Array.isArray(item[1])) {
          const list = el("ul", "clean-list");
          item[1].forEach((line) => list.append(el("li", "", line)));
          node.append(list);
          node.append(badge(item[2], item[3]));
        } else {
          node.append(el("p", "", item[1]));
        }
        return node;
      })
    );
  }

  function renderPlan() {
    const section = document.querySelector("#plan");
    sectionTitle(section, "📋 Projektový plán a master checklist");

    const progress = el("div", "progress-panel");
    const copy = el("div", "");
    copy.append(el("h3", "", "📊 Celkový stav checklistu"));
    const track = el("div", "progress-track");
    track.append(el("div", "progress-fill"));
    copy.append(track);
    copy.append(el("p", "progress-text"));
    progress.append(copy);
    progress.append(el("p", "progress-number", "0 %"));
    section.append(progress);

    section.append(
      grid(data.plan, (group) => {
        const node = el("article", "card");
        node.append(el("h3", "", group.title));
        const list = el("ul", "checklist");
        group.items.forEach(([id, label, checked]) => {
          const item = el("li", "");
          const wrapper = el("label", "");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.id = id;
          input.checked = savedChecklist[id] ?? checked;
          wrapper.append(input, el("span", "", label));
          item.append(wrapper);
          list.append(item);
        });
        node.append(list);
        return node;
      })
    );

    section.addEventListener("change", (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      saveChecklist();
      updateProgress();
    });

    updateProgress();
  }

  function renderElectricity() {
    const section = document.querySelector("#electricity");
    sectionTitle(section, "⚡ Elektřina a rozvod po zahradě");
    section.append(
      grid(data.electricity, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderTimeline() {
    const section = document.querySelector("#timeline");
    sectionTitle(section, "📅 Projektová timeline");
    section.append(
      grid(data.timeline, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderMissing() {
    const section = document.querySelector("#missing");
    sectionTitle(section, "⚠️ Co je potřeba doplnit");
    const list = el("ul", "missing-list");
    data.missing.forEach((item) => list.append(el("li", "", item)));
    section.append(list);
  }

  function updateProgress() {
    const plan = document.querySelector("#plan");
    const inputs = Array.from(plan.querySelectorAll('input[type="checkbox"]'));
    const checked = inputs.filter((input) => input.checked).length;
    const total = inputs.length;
    const pct = total ? Math.round((checked / total) * 100) : 0;

    plan.querySelector(".progress-fill").style.width = `${pct}%`;
    plan.querySelector(".progress-text").textContent = `${checked} / ${total} úkolů dokončeno`;
    plan.querySelector(".progress-number").textContent = `${pct} %`;
  }

  function readSavedChecklist() {
    try {
      return JSON.parse(localStorage.getItem(checklistStorageKey)) || {};
    } catch {
      return {};
    }
  }

  function saveChecklist() {
    const state = {};
    document.querySelectorAll('#plan input[type="checkbox"]').forEach((input) => {
      state[input.dataset.id] = input.checked;
    });
    localStorage.setItem(checklistStorageKey, JSON.stringify(state));
  }

  function render() {
    renderNav();
    renderOverview();
    renderDocuments();
    renderBudget();
    renderWorkCosts();
    renderWorklog();
    renderSettlement();
    renderProjects();
    renderPlan();
    renderElectricity();
    renderTimeline();
    renderMissing();
  }

  document.addEventListener("DOMContentLoaded", render);
})();

  </script>
