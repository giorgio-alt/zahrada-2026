<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahradní projekt - master dashboard</title>
  <style>
:root {
  --cream: #f7efe3;
  --sand: #ead7bd;
  --wood-light: #d3b58f;
  --ink: #2d241b;
  --muted: #66584b;
  --brown: #6f5138;
  --brown-deep: #2d241b;
  --green: #5a8f55;
  --orange: #b98228;
  --red: #a64d3f;
  --blue-gray: #4f7480;
  --glass: rgba(255, 255, 255, 0.28);
  --glass-strong: rgba(255, 255, 255, 0.42);
  --glass-soft: rgba(255, 255, 255, 0.18);
  --line: rgba(255, 255, 255, 0.56);
  --line-dark: rgba(82, 62, 43, 0.12);
  --shadow-section: 0 28px 80px rgba(70, 49, 30, 0.16);
  --shadow-card: 0 18px 48px rgba(70, 49, 30, 0.11);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  font-family: Inter, Arial, sans-serif;
  color: var(--ink);
  background:
    linear-gradient(145deg, rgba(247, 239, 227, 0.92), rgba(234, 215, 189, 0.86) 46%, rgba(218, 204, 182, 0.92)),
    linear-gradient(90deg, rgba(111, 81, 56, 0.1), rgba(90, 143, 85, 0.08));
  background-attachment: fixed;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  background: rgba(247, 239, 227, 0.45);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: 0 12px 34px rgba(70, 49, 30, 0.08);
}

.nav {
  display: flex;
  gap: 12px;
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px 22px;
  overflow-x: auto;
}

.nav a {
  flex: 0 0 auto;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  color: var(--ink);
  text-decoration: none;
  font-weight: 850;
  font-size: 14px;
  line-height: 1;
  padding: 12px 16px;
  border: 1px solid rgba(255, 255, 255, 0.64);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
  transition: background 180ms ease, box-shadow 180ms ease, color 180ms ease;
}

.nav a:hover {
  background: rgba(255, 255, 255, 0.52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px rgba(70, 49, 30, 0.1);
}

main {
  width: min(1500px, calc(100% - 44px));
  margin: 0 auto;
  padding: 38px 0 72px;
}

.section {
  position: relative;
  scroll-margin-top: 92px;
  margin: 0 0 34px;
  padding: clamp(26px, 3vw, 44px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 32px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.18));
  backdrop-filter: blur(26px) saturate(135%);
  box-shadow: var(--shadow-section), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.section::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
  pointer-events: none;
}

.hero-section {
  min-height: min(720px, calc(100vh - 96px));
  display: grid;
  align-content: center;
  gap: 30px;
}

.hero-copy {
  max-width: 980px;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--brown);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 13px;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

h1 {
  max-width: 1060px;
  margin: 0;
  font-size: clamp(40px, 5.6vw, 76px);
  line-height: 1.02;
  letter-spacing: 0;
}

h2 {
  margin: 0 0 28px;
  font-size: clamp(28px, 3vw, 44px);
  line-height: 1.12;
  letter-spacing: 0;
}

h3 {
  margin: 18px 0 14px;
  font-size: 21px;
  line-height: 1.28;
  letter-spacing: 0;
}

p {
  line-height: 1.65;
}

.hero-intro,
.section-intro {
  max-width: 960px;
  color: var(--muted);
  font-size: 18px;
}

.section-intro {
  margin-top: -12px;
  margin-bottom: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 20px;
  margin-top: 24px;
}

.card,
.progress-panel,
.total-box,
.missing-list li {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass-soft));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.card {
  min-height: 168px;
  padding: 24px;
  transition: background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.74);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.22));
  box-shadow: 0 22px 58px rgba(70, 49, 30, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.76);
}

.card p:last-child,
.section p:last-child {
  margin-bottom: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 8px 13px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  font-weight: 900;
  font-size: 13px;
}

.badge.good {
  background: linear-gradient(135deg, var(--green), #3f7043);
}

.badge.wait {
  background: linear-gradient(135deg, var(--orange), #8f651f);
}

.badge.risk {
  background: linear-gradient(135deg, var(--red), #7c382f);
}

.badge.split {
  background: linear-gradient(135deg, var(--blue-gray), #365965);
}

.amount {
  margin: 10px 0 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 900;
}

.button {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  margin-top: 14px;
  padding: 12px 18px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: 0 14px 30px rgba(45, 36, 27, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  text-decoration: none;
  font-weight: 900;
  transition: box-shadow 180ms ease, background 180ms ease;
}

.button:hover {
  background: linear-gradient(135deg, #7d5d42, var(--brown-deep));
  box-shadow: 0 18px 36px rgba(45, 36, 27, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.table-wrap {
  margin-top: 28px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
}

table {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
}

th,
td {
  padding: 16px 15px;
  border-bottom: 1px solid var(--line-dark);
  text-align: left;
  vertical-align: top;
  line-height: 1.5;
}

th {
  background: rgba(255, 255, 255, 0.26);
  color: var(--brown-deep);
  font-size: 14px;
}

tr:last-child td {
  border-bottom: 0;
}

.total-row td {
  font-weight: 900;
  background: rgba(111, 81, 56, 0.1);
}

.totals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 20px;
  margin-top: 22px;
}

.total-box {
  padding: 22px;
}

.total-box span {
  display: block;
  color: var(--muted);
  font-size: 14px;
  font-weight: 850;
}

.total-box strong {
  display: block;
  margin-top: 9px;
  font-size: 28px;
}

.clean-list,
.missing-list,
.checklist {
  padding-left: 0;
  list-style: none;
}

.clean-list li,
.missing-list li {
  margin: 10px 0;
}

.missing-list {
  display: grid;
  gap: 16px;
  max-width: 960px;
  margin-top: 22px;
}

.missing-list li {
  margin: 0;
  padding: 18px 20px;
}

.progress-panel {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 26px;
  align-items: center;
  padding: 24px;
  margin-top: 22px;
}

.progress-track {
  height: 24px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.62);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 8px rgba(45, 36, 27, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brown), #9b7654);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
  transition: width 240ms ease;
}

.progress-number {
  margin: 0;
  font-size: 42px;
  line-height: 1;
  font-weight: 900;
}

.checklist {
  display: grid;
  gap: 14px;
  margin: 0;
}

.checklist label {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 13px;
  align-items: start;
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.48);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.48);
}

.checklist input {
  appearance: none;
  width: 24px;
  height: 24px;
  margin: 0;
  border: 2px solid rgba(111, 81, 56, 0.5);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
}

.checklist input:checked {
  border-color: var(--brown);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, 0.86) 47% 56%, rgba(255, 255, 255, 0) 57%),
    linear-gradient(45deg, rgba(255, 255, 255, 0) 37%, rgba(255, 255, 255, 0.86) 38% 49%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(135deg, var(--brown), var(--brown-deep));
}

.checklist input:focus-visible {
  outline: 3px solid rgba(111, 81, 56, 0.24);
  outline-offset: 3px;
}

.checklist input:checked + span {
  color: var(--muted);
  text-decoration: line-through;
}

.calendar-layout {
  display: grid;
  gap: 22px;
  margin-top: 20px;
}

.calendar-panel,
.calendar-detail,
.calendar-legend {
  border: 1px solid var(--line);
  border-radius: 30px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.18));
  backdrop-filter: blur(22px) saturate(135%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.66);
}

.calendar-panel {
  padding: clamp(18px, 2vw, 28px);
}

.calendar-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}

.calendar-head .eyebrow,
.calendar-head h3 {
  margin: 0;
}

.calendar-head h3 {
  font-size: clamp(26px, 3vw, 40px);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: clamp(7px, 1vw, 13px);
}

.calendar-weekday {
  color: var(--muted);
  font-size: 13px;
  font-weight: 900;
  text-align: center;
  text-transform: uppercase;
}

.calendar-day {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 6px;
  min-width: 0;
  min-height: 104px;
  padding: 12px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 24px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.24);
  box-shadow: 0 12px 28px rgba(70, 49, 30, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.62);
  cursor: pointer;
  font: inherit;
  text-align: left;
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
}

.calendar-day:hover,
.calendar-day.is-selected {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.82);
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 18px 42px rgba(70, 49, 30, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.78);
}

.calendar-day.is-selected {
  outline: 3px solid rgba(111, 81, 56, 0.16);
}

.calendar-day:focus-visible {
  outline: 3px solid rgba(111, 81, 56, 0.28);
  outline-offset: 3px;
}

.calendar-day::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  opacity: 0.12;
  pointer-events: none;
}

.calendar-day.type-own::before {
  background: linear-gradient(145deg, var(--green), transparent 66%);
}

.calendar-day.type-shared::before {
  background: linear-gradient(145deg, var(--blue-gray), transparent 66%);
}

.calendar-day.type-mixed::before {
  background: linear-gradient(145deg, var(--orange), transparent 66%);
}

.calendar-day.type-payment::before {
  background: linear-gradient(145deg, var(--brown), transparent 66%);
}

.calendar-day.type-off {
  color: rgba(45, 36, 27, 0.62);
}

.calendar-day.type-off::before {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.7), transparent 70%);
}

.calendar-date {
  position: relative;
  z-index: 1;
  font-size: clamp(17px, 1.5vw, 23px);
  font-weight: 900;
}

.calendar-marker {
  position: relative;
  z-index: 1;
  align-self: center;
  justify-self: center;
  font-size: clamp(18px, 2vw, 28px);
  line-height: 1;
}

.calendar-short {
  position: relative;
  z-index: 1;
  min-height: 18px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 850;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
}

.calendar-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px;
}

.calendar-legend span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 850;
}

.legend-marker {
  font-size: 18px;
}

.calendar-detail {
  padding: clamp(20px, 3vw, 34px);
}

.calendar-detail h3 {
  margin-top: 18px;
  font-size: clamp(26px, 3vw, 38px);
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
  gap: 16px;
  margin-top: 22px;
}

.detail-block,
.detail-notes {
  border: 1px solid rgba(255, 255, 255, 0.52);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
}

.detail-block {
  padding: 18px;
}

.detail-notes {
  margin-top: 16px;
  padding: 20px;
}

.detail-block h4,
.detail-notes h4 {
  margin: 0 0 12px;
  font-size: 14px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--brown);
}

.detail-list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.detail-list li {
  line-height: 1.45;
}

.detail-list li::before {
  content: "✓";
  margin-right: 9px;
  color: var(--green);
  font-weight: 900;
}

.finance-list {
  display: grid;
  gap: 10px;
}

.finance-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: baseline;
  color: var(--muted);
}

.finance-row strong {
  color: var(--ink);
  font-size: 17px;
  text-align: right;
  white-space: nowrap;
}

@media (max-width: 760px) {
  main {
    width: min(100% - 24px, 1500px);
    padding: 22px 0 46px;
  }

  .nav {
    gap: 9px;
    padding: 12px;
  }

  .nav a {
    min-height: 40px;
    padding: 11px 14px;
  }

  .section {
    margin-bottom: 22px;
    padding: 24px;
    border-radius: 28px;
  }

  .hero-section {
    min-height: auto;
  }

  h1 {
    font-size: 38px;
  }

  .card,
  .progress-panel,
  .total-box,
  .missing-list li {
    border-radius: 24px;
  }

  .progress-panel {
    grid-template-columns: 1fr;
  }

  .progress-number {
    font-size: 34px;
  }

  .calendar-panel {
    padding: 14px;
  }

  .calendar-head {
    display: block;
  }

  .calendar-grid {
    gap: 6px;
  }

  .calendar-weekday {
    font-size: 11px;
  }

  .calendar-day {
    min-height: 66px;
    padding: 8px 6px;
    border-radius: 18px;
  }

  .calendar-date {
    font-size: 16px;
  }

  .calendar-marker {
    font-size: 17px;
  }

  .calendar-short {
    display: none;
  }

  .calendar-detail,
  .calendar-legend {
    border-radius: 24px;
  }

  .finance-row {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .finance-row strong {
    text-align: left;
  }
}

  </style>

  <script>
(function () {
  const data = window.ZAHRADA_DASHBOARD;
  const checklistStorageKey = "zahrada-checklist-v1";

  const savedChecklist = readSavedChecklist();

  function text(value) {
    return String(value ?? "");
  }

  function el(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function badge(label, tone) {
    const node = el("span", `badge ${tone || ""}`.trim(), label);
    return node;
  }

  function card(item) {
    const node = el("article", "card");
    node.append(badge(item.badge, item.tone));
    node.append(el("h3", "", item.title));
    if (item.amount) node.append(el("p", "amount", item.amount));
    if (item.body) node.append(paragraphs(item.body));
    return node;
  }

  function summaryCard(tuple) {
    const [label, tone, title, amount, body] = tuple;
    return card({ badge: label, tone, title, amount, body });
  }

  function paragraphs(value) {
    const wrapper = document.createDocumentFragment();
    text(value)
      .split("\n")
      .filter(Boolean)
      .forEach((line) => wrapper.append(el("p", "", line)));
    return wrapper;
  }

  function grid(items, renderItem) {
    const node = el("div", "grid");
    items.forEach((item) => node.append(renderItem(item)));
    return node;
  }

  function sectionTitle(section, title, intro) {
    section.replaceChildren();
    section.append(el("h2", "", title));
    if (intro) section.append(el("p", "section-intro", intro));
  }

  function table(headers, rows, total) {
    const wrap = el("div", "table-wrap");
    const tableEl = document.createElement("table");
    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    headers.forEach((header) => headerRow.append(el("th", "", header)));
    thead.append(headerRow);
    tableEl.append(thead);

    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      row.forEach((cell) => tr.append(el("td", "", cell)));
      tbody.append(tr);
    });

    if (total) {
      const tr = document.createElement("tr");
      tr.className = "total-row";
      total.forEach((cell) => tr.append(el("td", "", cell)));
      tbody.append(tr);
    }

    tableEl.append(tbody);
    wrap.append(tableEl);
    return wrap;
  }

  function formatMoney(value) {
    if (value === undefined || value === null || value === "") return "";
    if (typeof value === "number") return `${value.toLocaleString("cs-CZ")} Kč`;
    return value;
  }

  function worklogMarker(type) {
    return {
      own: "🟩",
      shared: "🟦",
      mixed: "🟧",
      payment: "💸",
      off: "⬜",
    }[type || "off"];
  }

  function worklogTone(type) {
    return {
      own: "good",
      shared: "split",
      mixed: "wait",
      payment: "good",
      off: "",
    }[type || "off"];
  }

  function renderNav() {
    const nav = document.querySelector("#mainNav");
    data.nav.forEach(([id, label]) => {
      const link = el("a", "", label);
      link.href = `#${id}`;
      nav.append(link);
    });
  }

  function renderOverview() {
    const section = document.querySelector("#overview");
    section.replaceChildren();
    const titleWrap = el("div", "hero-copy");
    titleWrap.append(el("p", "eyebrow", "Aktuální stav projektu"));
    titleWrap.append(el("h1", "", data.title));
    titleWrap.append(el("p", "hero-intro", data.intro));
    section.append(titleWrap);
    section.append(grid(data.overview, card));
  }

  function renderDocuments() {
    const section = document.querySelector("#docs");
    sectionTitle(section, "🔗 Rozcestník dokumentů a odkazů");
    section.append(
      grid(data.documents, (item) => {
        const node = el("article", "card");
        node.append(el("h3", "", item.title));
        if (item.body) node.append(el("p", "", item.body));
        if (item.href) {
          const link = el("a", "button", `${item.label} ↗`);
          link.href = item.href;
          link.target = "_blank";
          link.rel = "noreferrer";
          node.append(link);
        }
        return node;
      })
    );
  }

  function renderBudget() {
    const section = document.querySelector("#budget");
    sectionTitle(section, "💰 Rozpočet a známé náklady");
    section.append(grid(data.budget.cards, summaryCard));
    section.append(table(["Položka", "Částka", "Stav"], data.budget.rows, data.budget.totals[0]));

    const totals = el("div", "totals");
    data.budget.totals.forEach(([label, amount]) => {
      const item = el("div", "total-box");
      item.append(el("span", "", label));
      item.append(el("strong", "", amount));
      totals.append(item);
    });
    section.append(totals);
  }

  function renderWorkCosts() {
    const section = document.querySelector("#work-costs");
    sectionTitle(section, "👷 Kompletní výpočet práce Ivanovy party", data.workCosts.note);
    section.append(grid(data.workCosts.cards, summaryCard));
    section.append(table(data.workCosts.headers, data.workCosts.rows, data.workCosts.total));
  }

  function renderWorklog() {
    const section = document.querySelector("#worklog");
    const calendar = data.worklog;
    sectionTitle(section, "📒 Stavební kalendář");

    const layout = el("div", "calendar-layout");
    const panel = el("div", "calendar-panel");
    const header = el("div", "calendar-head");
    header.append(el("p", "eyebrow", "Měsíční přehled stavby"));
    header.append(el("h3", "", calendar.monthLabel));
    panel.append(header);

    const calendarGrid = el("div", "calendar-grid");
    calendar.weekdays.forEach((weekday) => calendarGrid.append(el("div", "calendar-weekday", weekday)));

    const detail = el("article", "calendar-detail");
    const days = calendar.days || [];
    const selectedDay = days.find((day) => day.selected) || days.find((day) => day.type !== "off") || days[0];

    function selectDay(day) {
      calendarGrid.querySelectorAll(".calendar-day").forEach((button) => {
        const isSelected = button.dataset.key === worklogDayKey(day);
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-expanded", String(isSelected));
      });
      renderWorklogDetail(detail, day);
    }

    days.forEach((day) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `calendar-day type-${day.type || "off"}`;
      button.dataset.key = worklogDayKey(day);
      button.title = day.tooltip || `${day.label || day.day}. ${day.title || "Nepracovalo se"}`;
      button.setAttribute("aria-expanded", "false");
      button.append(el("span", "calendar-date", day.label || day.day));
      button.append(el("span", "calendar-marker", worklogMarker(day.type)));
      if (day.short) button.append(el("span", "calendar-short", day.short));
      calendarGrid.append(button);
    });

    calendarGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".calendar-day");
      if (!button) return;
      const day = days.find((item) => worklogDayKey(item) === button.dataset.key);
      if (day) selectDay(day);
    });

    panel.append(calendarGrid);
    layout.append(panel);

    const legend = el("div", "calendar-legend");
    calendar.legend.forEach(([marker, label]) => {
      const item = el("span", "");
      item.append(el("span", "legend-marker", marker), el("span", "", label));
      legend.append(item);
    });
    layout.append(legend);
    layout.append(detail);
    section.append(layout);

    if (selectedDay) selectDay(selectedDay);
  }

  function renderWorklogDetail(container, day) {
    const detail = day.detail || {};
    const finance = detail.finance;
    container.replaceChildren();
    container.className = `calendar-detail type-${day.type || "off"}`;
    container.append(badge(`${worklogMarker(day.type)} ${day.title || "Nepracovalo se"}`, worklogTone(day.type)));
    container.append(el("h3", "", `📅 ${detail.date || `${day.day}. 6. 2026`}`));

    const detailGrid = el("div", "detail-grid");
    detailGrid.append(detailBlock("👷 Pracovali", listContent(detail.workers, "Nepracovalo se")));
    detailGrid.append(detailBlock("Hotovo", listContent(detail.done, day.title || "Nepracovalo se")));
    detailGrid.append(detailBlock("💰 Finance", financeContent(finance, day.type)));
    detailGrid.append(detailBlock("Dotčené projekty", listContent(detail.projects, "Bez vazby na aktivní projekt")));
    container.append(detailGrid);

    const notes = el("div", "detail-notes");
    notes.append(el("h4", "", "Poznámky"));
    notes.append(el("p", "", detail.notes || "Bez stavební aktivity."));
    container.append(notes);
  }

  function detailBlock(title, content) {
    const block = el("div", "detail-block");
    block.append(el("h4", "", title));
    block.append(content);
    return block;
  }

  function listContent(items, fallback) {
    const list = el("ul", "detail-list");
    const values = Array.isArray(items) && items.length ? items : [fallback];
    values.forEach((item) => list.append(el("li", "", item)));
    return list;
  }

  function financeContent(finance, type) {
    const wrap = el("div", "finance-list");
    if (!finance) {
      wrap.append(financeRow("Celkem", type === "off" ? "0 Kč" : "Doplnit"));
      return wrap;
    }

    wrap.append(financeRow("Celkem", formatMoney(finance.total)));
    if (finance.sharedPercent) wrap.append(financeRow("Společný projekt", `${finance.sharedPercent} % / ${formatMoney(finance.sharedAmount)}`));
    if (finance.ownPercent) wrap.append(financeRow("Náš projekt", `${finance.ownPercent} % / ${formatMoney(finance.ownAmount)}`));
    if (finance.ourSharedShare !== undefined) wrap.append(financeRow("Náš podíl ze společné části", formatMoney(finance.ourSharedShare)));
    if (finance.neighborSharedShare !== undefined) wrap.append(financeRow("Podíl Lofflemanových", formatMoney(finance.neighborSharedShare)));
    if (finance.ourCost !== undefined) wrap.append(financeRow("Náš reálný náklad", formatMoney(finance.ourCost)));
    if (Array.isArray(finance.extraRows)) {
      finance.extraRows.forEach(([label, value]) => wrap.append(financeRow(label, value)));
    }
    return wrap;
  }

  function financeRow(label, value) {
    const row = el("div", "finance-row");
    row.append(el("span", "", label), el("strong", "", value));
    return row;
  }

  function worklogDayKey(day) {
    return day.id || `${day.detail?.date || ""}-${day.day}`;
  }

  function renderSettlement() {
    const section = document.querySelector("#settlement");
    sectionTitle(section, "🤝 Společné náklady s Lofflemanovými", data.settlement.intro);
    section.append(grid(data.settlement.cards, summaryCard));
    section.append(table(data.settlement.headers, data.settlement.rows, data.settlement.total));
    section.append(grid(data.settlement.breakdown, summaryCard));
  }

  function renderProjects() {
    const section = document.querySelector("#projects");
    sectionTitle(section, "✅ Projektové sekce");
    section.append(
      grid(data.projects, (item) => {
        const node = el("article", "card");
        node.append(el("h3", "", item[0]));
        if (Array.isArray(item[1])) {
          const list = el("ul", "clean-list");
          item[1].forEach((line) => list.append(el("li", "", line)));
          node.append(list);
          node.append(badge(item[2], item[3]));
        } else {
          node.append(el("p", "", item[1]));
        }
        return node;
      })
    );
  }

  function renderPlan() {
    const section = document.querySelector("#plan");
    sectionTitle(section, "📋 Projektový plán a master checklist");

    const progress = el("div", "progress-panel");
    const copy = el("div", "");
    copy.append(el("h3", "", "📊 Celkový stav checklistu"));
    const track = el("div", "progress-track");
    track.append(el("div", "progress-fill"));
    copy.append(track);
    copy.append(el("p", "progress-text"));
    progress.append(copy);
    progress.append(el("p", "progress-number", "0 %"));
    section.append(progress);

    section.append(
      grid(data.plan, (group) => {
        const node = el("article", "card");
        node.append(el("h3", "", group.title));
        const list = el("ul", "checklist");
        group.items.forEach(([id, label, checked]) => {
          const item = el("li", "");
          const wrapper = el("label", "");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.id = id;
          input.checked = savedChecklist[id] ?? checked;
          wrapper.append(input, el("span", "", label));
          item.append(wrapper);
          list.append(item);
        });
        node.append(list);
        return node;
      })
    );

    section.addEventListener("change", (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      saveChecklist();
      updateProgress();
    });

    updateProgress();
  }

  function renderElectricity() {
    const section = document.querySelector("#electricity");
    sectionTitle(section, "⚡ Elektřina a rozvod po zahradě");
    section.append(
      grid(data.electricity, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderTimeline() {
    const section = document.querySelector("#timeline");
    sectionTitle(section, "📅 Projektová timeline");
    section.append(
      grid(data.timeline, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderMissing() {
    const section = document.querySelector("#missing");
    sectionTitle(section, "⚠️ Co je potřeba doplnit");
    const list = el("ul", "missing-list");
    data.missing.forEach((item) => list.append(el("li", "", item)));
    section.append(list);
  }

  function updateProgress() {
    const plan = document.querySelector("#plan");
    const inputs = Array.from(plan.querySelectorAll('input[type="checkbox"]'));
    const checked = inputs.filter((input) => input.checked).length;
    const total = inputs.length;
    const pct = total ? Math.round((checked / total) * 100) : 0;

    plan.querySelector(".progress-fill").style.width = `${pct}%`;
    plan.querySelector(".progress-text").textContent = `${checked} / ${total} úkolů dokončeno`;
    plan.querySelector(".progress-number").textContent = `${pct} %`;
  }

  function readSavedChecklist() {
    try {
      return JSON.parse(localStorage.getItem(checklistStorageKey)) || {};
    } catch {
      return {};
    }
  }

  function saveChecklist() {
    const state = {};
    document.querySelectorAll('#plan input[type="checkbox"]').forEach((input) => {
      state[input.dataset.id] = input.checked;
    });
    localStorage.setItem(checklistStorageKey, JSON.stringify(state));
  }

  function render() {
    renderNav();
    renderOverview();
    renderDocuments();
    renderBudget();
    renderWorkCosts();
    renderWorklog();
    renderSettlement();
    renderProjects();
    renderPlan();
    renderElectricity();
    renderTimeline();
    renderMissing();
  }

  document.addEventListener("DOMContentLoaded", render);
})();

  </script>
</body>
</html>
