<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahradní projekt - master dashboard</title>
  <style>
:root {
  --cream: #f7efe3;
  --sand: #ead7bd;
  --wood-light: #d3b58f;
  --ink: #2d241b;
  --muted: #66584b;
  --brown: #6f5138;
  --brown-deep: #2d241b;
  --green: #5a8f55;
  --orange: #b98228;
  --red: #a64d3f;
  --blue-gray: #4f7480;
  --glass: rgba(255, 255, 255, 0.28);
  --glass-strong: rgba(255, 255, 255, 0.42);
  --glass-soft: rgba(255, 255, 255, 0.18);
  --line: rgba(255, 255, 255, 0.56);
  --line-dark: rgba(82, 62, 43, 0.12);
  --shadow-section: 0 28px 80px rgba(70, 49, 30, 0.16);
  --shadow-card: 0 18px 48px rgba(70, 49, 30, 0.11);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  min-width: 320px;
  font-family: Inter, Arial, sans-serif;
  color: var(--ink);
  background:
    linear-gradient(145deg, rgba(247, 239, 227, 0.92), rgba(234, 215, 189, 0.86) 46%, rgba(218, 204, 182, 0.92)),
    linear-gradient(90deg, rgba(111, 81, 56, 0.1), rgba(90, 143, 85, 0.08));
  background-attachment: fixed;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  background: rgba(247, 239, 227, 0.45);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: 0 12px 34px rgba(70, 49, 30, 0.08);
}

.nav {
  display: flex;
  gap: 12px;
  max-width: 1500px;
  margin: 0 auto;
  padding: 16px 22px;
  overflow-x: auto;
}

.nav a {
  flex: 0 0 auto;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  color: var(--ink);
  text-decoration: none;
  font-weight: 850;
  font-size: 14px;
  line-height: 1;
  padding: 12px 16px;
  border: 1px solid rgba(255, 255, 255, 0.64);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
  transition: background 180ms ease, box-shadow 180ms ease, color 180ms ease;
}

.nav a:hover {
  background: rgba(255, 255, 255, 0.52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px rgba(70, 49, 30, 0.1);
}

.nav a:focus-visible,
button:focus-visible,
summary:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(79, 116, 128, 0.62);
  outline-offset: 3px;
}

.nav a.is-active {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.82);
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: 0 12px 30px rgba(70, 49, 30, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.32);
}

main {
  width: min(1500px, calc(100% - 44px));
  margin: 0 auto;
  padding: 38px 0 72px;
}

.section {
  position: relative;
  scroll-margin-top: 92px;
  margin: 0 0 34px;
  padding: clamp(26px, 3vw, 44px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 32px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.18));
  backdrop-filter: blur(26px) saturate(135%);
  box-shadow: var(--shadow-section), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.section::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
  pointer-events: none;
}

.hero-section {
  min-height: min(720px, calc(100vh - 96px));
  display: grid;
  align-content: center;
  gap: 30px;
}

.hero-copy {
  max-width: 980px;
}

.eyebrow {
  margin: 0 0 16px;
  color: var(--brown);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 13px;
}

h1,
h2,
h3,
p {
  overflow-wrap: anywhere;
}

h1 {
  max-width: 1060px;
  margin: 0;
  font-size: clamp(40px, 5.6vw, 76px);
  line-height: 1.02;
  letter-spacing: 0;
}

h2 {
  margin: 0 0 28px;
  font-size: clamp(28px, 3vw, 44px);
  line-height: 1.12;
  letter-spacing: 0;
}

h3 {
  margin: 18px 0 14px;
  font-size: 21px;
  line-height: 1.28;
  letter-spacing: 0;
}

p {
  line-height: 1.65;
}

.hero-intro,
.section-intro {
  max-width: 960px;
  color: var(--muted);
  font-size: 18px;
}

.section-intro {
  margin-top: -12px;
  margin-bottom: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 20px;
  margin-top: 24px;
}

.card,
.progress-panel,
.total-box,
.missing-list li {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass-soft));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.card {
  min-height: 168px;
  padding: 24px;
  transition: background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.74);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.22));
  box-shadow: 0 22px 58px rgba(70, 49, 30, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.76);
}

.global-progress-panel,
.project-filter-bar {
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass-soft));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.global-progress-panel {
  display: grid;
  grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.4fr);
  gap: 22px;
  align-items: center;
  padding: 22px;
}

.global-progress-main h3 {
  margin: 0 0 14px;
  font-size: clamp(26px, 3vw, 42px);
  line-height: 1;
}

.global-progress-main .eyebrow {
  margin-bottom: 10px;
}

.global-progress-track {
  height: 18px;
}

.global-progress-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.progress-kpi {
  min-height: 86px;
  padding: 15px;
  border: 1px solid rgba(255, 255, 255, 0.46);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.54);
}

.progress-kpi span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
}

.progress-kpi strong {
  display: block;
  margin-top: 8px;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 950;
}

.project-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  padding: 13px 16px;
  color: var(--muted);
  font-weight: 850;
}

.project-filter-bar.is-active {
  color: var(--ink);
  border-color: rgba(90, 143, 85, 0.28);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.52), rgba(90, 143, 85, 0.14));
}

.filter-label {
  font-weight: 950;
}

.filter-clear {
  min-height: 36px;
  padding: 8px 13px;
  border: 1px solid rgba(111, 81, 56, 0.22);
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 900;
}

.filter-empty {
  grid-column: 1 / -1;
  margin: 0;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.46);
  border-radius: 20px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.22);
  font-weight: 850;
}

.recent-card {
  min-height: 148px;
}

.kanban-board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  margin-top: 22px;
}

.kanban-column {
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.16));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

.kanban-column h3 {
  margin: 0 0 16px;
  font-size: 20px;
}

.kanban-list {
  display: grid;
  gap: 12px;
}

.kanban-card {
  min-height: 150px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.52);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.24);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
  cursor: pointer;
  transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.kanban-card:hover,
.kanban-card:focus-visible,
.kanban-card.is-active {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.82);
  background: rgba(255, 255, 255, 0.44);
  box-shadow: 0 18px 42px rgba(70, 49, 30, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.78);
  outline: 0;
}

.kanban-card.is-active {
  border-color: rgba(90, 143, 85, 0.42);
  box-shadow: 0 18px 42px rgba(90, 143, 85, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.78);
}

.kanban-card h4 {
  margin: 14px 0 8px;
  font-size: 18px;
  line-height: 1.2;
}

.kanban-card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
}

.kanban-card .next-step {
  margin-top: 10px;
  color: var(--ink);
  font-weight: 850;
}

.project-card-detail {
  margin-top: 12px;
}

.project-card-detail summary {
  cursor: pointer;
  color: var(--brown);
  font-size: 13px;
  font-weight: 950;
}

.finance-overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 22px;
  margin-top: 24px;
}

.finance-summary-card,
.finance-detail {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, var(--glass-strong), var(--glass-soft));
  backdrop-filter: blur(20px) saturate(130%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.finance-summary-card {
  padding: 0;
  overflow: hidden;
  border-radius: 24px;
}

.finance-summary-header {
  min-height: 76px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: #fff;
  font-size: 22px;
  font-weight: 950;
  letter-spacing: 0;
}

.finance-summary-icon {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: rgba(30, 30, 30, 0.84);
  background: rgba(255, 255, 255, 0.88);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.68), 0 10px 18px rgba(45, 36, 27, 0.12);
  font-size: 22px;
  line-height: 1;
}

.finance-summary-label {
  min-width: 0;
  overflow-wrap: anywhere;
}

.finance-summary-body {
  padding: 22px 24px 26px;
}

.finance-summary-body h3 {
  margin: 0 0 18px;
  color: var(--ink);
  font-size: 20px;
  line-height: 1.2;
  font-weight: 900;
}

.finance-summary-card .amount {
  margin: 0;
  color: var(--ink);
  font-size: clamp(34px, 4vw, 50px);
  line-height: 1;
  font-weight: 950;
  letter-spacing: 0;
}

.finance-summary-card.good .finance-summary-header,
.finance-summary-card.tone-good .finance-summary-header {
  background: linear-gradient(135deg, var(--green), #3f7043);
}

.finance-summary-card.split .finance-summary-header,
.finance-summary-card.tone-split .finance-summary-header {
  background: linear-gradient(135deg, var(--blue-gray), #365965);
}

.finance-summary-card.wait .finance-summary-header,
.finance-summary-card.tone-wait .finance-summary-header {
  background: linear-gradient(135deg, var(--orange), #8f651f);
}

.finance-summary-card.risk .finance-summary-header,
.finance-summary-card.tone-risk .finance-summary-header {
  background: linear-gradient(135deg, var(--red), #7c382f);
}

.finance-summary-card.neutral .finance-summary-header,
.finance-summary-card.tone-neutral .finance-summary-header {
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
}

.finance-card-question {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
}

.metric-list {
  display: grid;
  gap: 10px;
  margin: 0;
}

.metric-row {
  display: grid;
  grid-template-columns: minmax(86px, 0.8fr) minmax(0, 1.2fr);
  gap: 12px;
  align-items: baseline;
  padding: 11px 0;
  border-top: 1px solid var(--line-dark);
  min-width: 0;
}

.metric-row dt {
  color: var(--muted);
  font-size: 13px;
  font-weight: 850;
}

.metric-row dd {
  margin: 0;
  font-size: 16px;
  font-weight: 950;
  text-align: right;
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.finance-detail {
  margin-top: 18px;
  overflow: hidden;
  border-radius: 28px;
}

.finance-detail summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 66px;
  padding: 20px 24px;
  cursor: pointer;
  font-size: 18px;
  font-weight: 950;
  list-style: none;
}

.finance-detail summary::-webkit-details-marker {
  display: none;
}

.finance-detail summary::after {
  content: "⌄";
  display: inline-grid;
  place-items: center;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  transition: transform 180ms ease;
}

.finance-detail[open] summary::after {
  transform: rotate(180deg);
}

.finance-detail-body {
  padding: 0 24px 24px;
}

.finance-detail-body .section-intro {
  margin: 0 0 18px;
}

.finance-notice {
  margin: 18px 0 0;
  padding: 14px 16px;
  border: 1px solid rgba(185, 130, 40, 0.24);
  border-radius: 16px;
  color: var(--brown-deep);
  background: rgba(255, 255, 255, 0.34);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
  font-weight: 750;
}

.finance-metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 22px;
  margin-top: 18px;
}

.card p:last-child,
.section p:last-child {
  margin-bottom: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 8px 13px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  font-weight: 900;
  font-size: 13px;
}

.badge.good {
  background: linear-gradient(135deg, var(--green), #3f7043);
}

.badge.wait {
  background: linear-gradient(135deg, var(--orange), #8f651f);
}

.badge.risk {
  background: linear-gradient(135deg, var(--red), #7c382f);
}

.badge.split {
  background: linear-gradient(135deg, var(--blue-gray), #365965);
}

.amount {
  margin: 10px 0 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 900;
}

.timeline-track {
  --timeline-line-y: 34px;
  position: relative;
  margin-top: 20px;
  padding: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.17));
  backdrop-filter: blur(22px) saturate(135%);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.64);
}

.timeline-track::before {
  content: "";
  position: absolute;
  top: var(--timeline-line-y);
  right: 30px;
  left: 30px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(90, 143, 85, 0.18), rgba(185, 130, 40, 0.34), rgba(111, 81, 56, 0.16));
}

.timeline-flow {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.timeline-flow::before {
  content: "";
  position: absolute;
  top: calc(var(--timeline-line-y) - 1px);
  left: -90px;
  width: 90px;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.92), transparent);
  filter: blur(0.2px);
  animation: timelinePulse 7s ease-in-out infinite;
}

.timeline-milestones {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
  gap: 16px;
}

.timeline-item {
  position: relative;
  min-height: 146px;
  padding: 40px 16px 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.54);
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.2));
  box-shadow: 0 14px 34px rgba(70, 49, 30, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.68);
}

.timeline-item::before {
  content: "";
  position: absolute;
  top: 27px;
  right: 0;
  left: 0;
  height: 2px;
  background: rgba(111, 81, 56, 0.13);
}

.timeline-node {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 1;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.84);
  border-radius: 50%;
  background: var(--wood-light);
  box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.3), 0 8px 20px rgba(45, 36, 27, 0.12);
}

.timeline-content {
  display: grid;
  gap: 7px;
}

.timeline-date {
  color: var(--muted);
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 0;
  text-transform: uppercase;
}

.timeline-content h3 {
  margin: 0;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.25;
  font-weight: 950;
}

.timeline-content p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.timeline-done .timeline-node {
  background: linear-gradient(135deg, var(--green), #3f7043);
}

.timeline-progress .timeline-node {
  background: linear-gradient(135deg, var(--orange), #8f651f);
}

.timeline-planned .timeline-node {
  background: linear-gradient(135deg, var(--wood-light), var(--brown));
}

.timeline-done {
  border-color: rgba(90, 143, 85, 0.26);
}

.timeline-progress {
  border-color: rgba(185, 130, 40, 0.32);
}

.timeline-planned {
  border-color: rgba(111, 81, 56, 0.2);
}

@keyframes timelinePulse {
  0% {
    opacity: 0;
    transform: translateX(0);
  }

  12%,
  82% {
    opacity: 0.92;
  }

  100% {
    opacity: 0;
    transform: translateX(calc(100vw + 180px));
  }
}

.button {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  margin-top: 14px;
  padding: 12px 18px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, var(--brown), var(--brown-deep));
  box-shadow: 0 14px 30px rgba(45, 36, 27, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  text-decoration: none;
  font-weight: 900;
  transition: box-shadow 180ms ease, background 180ms ease;
}

.button:hover {
  background: linear-gradient(135deg, #7d5d42, var(--brown-deep));
  box-shadow: 0 18px 36px rgba(45, 36, 27, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.28);
}

.table-wrap {
  margin-top: 28px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(20px) saturate(130%);

  <script>
(function () {
  const data = window.ZAHRADA_DASHBOARD;
  const checklistStorageKey = "zahrada-checklist-v1";

  const savedChecklist = readSavedChecklist();
  let activeProjectId = null;

  function text(value) {
    return String(value ?? "");
  }

  function el(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function badge(label, tone) {
    const node = el("span", `badge ${tone || ""}`.trim(), label);
    return node;
  }

  function card(item) {
    const node = el("article", "card");
    node.append(badge(item.badge, item.tone));
    node.append(el("h3", "", item.title));
    if (item.amount) node.append(el("p", "amount", item.amount));
    if (item.body) node.append(paragraphs(item.body));
    return node;
  }

  function summaryCard(tuple) {
    const [label, tone, title, amount, body] = tuple;
    return card({ badge: label, tone, title, amount, body });
  }

  function paragraphs(value) {
    const wrapper = document.createDocumentFragment();
    text(value)
      .split("\n")
      .filter(Boolean)
      .forEach((line) => wrapper.append(el("p", "", line)));
    return wrapper;
  }

  function grid(items, renderItem) {
    const node = el("div", "grid");
    items.forEach((item) => node.append(renderItem(item)));
    return node;
  }

  function sectionTitle(section, title, intro) {
    section.replaceChildren();
    section.append(el("h2", "", title));
    if (intro) section.append(el("p", "section-intro", intro));
  }

  function table(headers, rows, total) {
    const wrap = el("div", "table-wrap");
    const tableEl = document.createElement("table");
    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    headers.forEach((header) => headerRow.append(el("th", "", header)));
    thead.append(headerRow);
    tableEl.append(thead);

    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      row.forEach((cell) => tr.append(tableCell(cell)));
      tbody.append(tr);
    });

    if (total) {
      const tr = document.createElement("tr");
      tr.className = "total-row";
      total.forEach((cell) => tr.append(tableCell(cell)));
      tbody.append(tr);
    }

    tableEl.append(tbody);
    wrap.append(tableEl);
    return wrap;
  }

  function tableCell(cell) {
    const td = document.createElement("td");
    if (cell && typeof cell === "object" && cell.party) {
      const tag = el("span", "table-party-badge", cell.party);
      if (cell.title) tag.title = cell.title;
      td.className = "table-party-cell";
      td.append(tag);
      return td;
    }
    if (cell && typeof cell === "object" && Array.isArray(cell.links)) {
      const wrap = el("div", "table-link-list");
      if (cell.badge || cell.label) {
        const label = el("span", `table-status-badge ${cell.tone || ""}`.trim(), cell.badge || cell.label);
        if (cell.title) label.title = cell.title;
        wrap.append(label);
      }
      cell.links.forEach((item) => {
        const link = el("a", "table-link", item.label || "Otevřít ↗");
        link.href = item.href;
        link.target = "_blank";
        link.rel = "noreferrer";
        if (item.title) link.title = item.title;
        wrap.append(link);
      });
      td.append(wrap);
      return td;
    }
    if (cell && typeof cell === "object" && cell.badge) {
      const tag = cell.href ? el("a", `table-status-badge ${cell.tone || ""}`.trim(), cell.badge) : el("span", `table-status-badge ${cell.tone || ""}`.trim(), cell.badge);
      if (cell.title) tag.title = cell.title;
      if (cell.href) {
        tag.href = cell.href;
        tag.target = "_blank";
        tag.rel = "noreferrer";
      }
      td.append(tag);
      return td;
    }
    if (cell && typeof cell === "object" && cell.href) {
      const link = el("a", "table-link", cell.label || "Otevřít ↗");
      link.href = cell.href;
      link.target = "_blank";
      link.rel = "noreferrer";
      td.append(link);
      return td;
    }
    td.textContent = text(cell);
    return td;
  }

  function formatMoney(value) {
    if (value === undefined || value === null || value === "") return "";
    if (typeof value === "number") return `${value.toLocaleString("cs-CZ")} Kč`;
    return value;
  }

  function worklogMarker(type) {
    return {
      own: "🟩",
      shared: "🟦",
      mixed: "🟧",
      payment: "💸",
      off: "⬜",
    }[type || "off"];
  }

  function worklogTone(type) {
    return {
      own: "good",
      shared: "split",
      mixed: "wait",
      payment: "good",
      off: "",
    }[type || "off"];
  }

  function renderNav() {
    const nav = document.querySelector("#mainNav");
    data.nav.forEach(([id, label]) => {
      const link = el("a", "", label);
      link.href = `#${id}`;
      link.dataset.section = id;
      nav.append(link);
    });
    setupActiveNav();
  }

  function renderOverview() {
    const section = document.querySelector("#overview");
    section.replaceChildren();
    const titleWrap = el("div", "hero-copy");
    titleWrap.append(el("p", "eyebrow", "Aktuální stav projektu"));
    titleWrap.append(el("h1", "", data.title));
    titleWrap.append(el("p", "hero-intro", data.intro));
    section.append(titleWrap);
    section.append(projectFilterBar());
    section.append(globalProgressPanel());
    section.append(grid(data.overview, card));
  }

  function renderRecentChanges() {
    const section = document.querySelector("#recent");
    sectionTitle(section, "🆕 Co se změnilo", "Rychlý přehled posledních důležitých posunů v projektu.");
    section.append(
      grid(data.recentChanges || [], (item) => {
        const node = el("article", "card recent-card");
        node.append(badge(item.date, "good"));
        node.append(el("h3", "", item.title));
        node.append(el("p", "", item.body));
        return node;
      })
    );
  }

  function renderDocuments() {
    const section = document.querySelector("#docs");
    sectionTitle(section, "🔗 Rozcestník dokumentů a odkazů");
    section.append(
      grid(data.documents, (item) => {
        const node = el("article", "card");
        node.append(el("h3", "", item.title));
        if (item.body) node.append(el("p", "", item.body));
        if (item.href) {
          const link = el("a", "button", `${item.label} ↗`);
          link.href = item.href;
          link.target = "_blank";
          link.rel = "noreferrer";
          node.append(link);
        }
        return node;
      })
    );
  }

  function renderFinance() {
    const section = document.querySelector("#finance");
    sectionTitle(section, "💰 Finance", "Rychlý přehled klíčových finančních pohledů. Detail každé oblasti je sbalený níže.");
    section.append(financeOverviewGrid(financeOverviewItems()));

    section.append(
      financeDetail("💰 Detail celkové investice", [
        totalsGrid(data.budget.totals),
        table(["Položka", "Částka", "Stav"], data.budget.rows, data.budget.totals[0]),
      ])
    );

    section.append(
      financeDetail("💸 Detail cashflow", [
        financeCashflowCards(data.finance.cashflow.rows),
        table(data.finance.cashflow.headers, data.finance.cashflow.rows, data.finance.cashflow.total),
      ])
    );

    section.append(
      financeDetail("🤝 Archiv vyúčtování s Löffelmanovými", [
        financeTupleMetrics(data.settlementReceivable.cards),
        totalsGrid(data.settlementReceivable.formula),
        table(data.settlement.headers, data.settlement.rows, data.settlement.total),
        financeTupleMetrics(data.settlement.breakdown),
        table(data.settlementReceivable.headers, data.settlementReceivable.rows, data.settlementReceivable.total),
      ], "Uzavřený historický detail společného projektu dokončeného 17. 7. 2026. Blok zůstává zavřený, aby archiv nepřebíjel aktivní práci.")
    );

    section.append(
      financeDetail("👷 Detail Ivanovy party", [
        financeTupleMetrics(workPaymentSummaryCards()),
        notice(data.workPaymentLedger?.note || "Platby zatím nejsou přiřazené ke konkrétním pracovním dnům."),
        table(workPaymentHeaders(), workPaymentRows(), workPaymentTotalRow()),
      ], data.workCosts.note)
    );
  }

  function financeOverviewGrid(items) {
    const node = el("div", "finance-overview-grid");
    items.forEach((item) => node.append(financeOverviewCard(item)));
    return node;
  }

  function financeOverviewItems() {
    return (data.finance.overview || []).map((item) => {
      if (!normalizeText(item.title).includes("ivanova parta")) return item;
      const summary = calculateWorkTotals();
      return {
        ...item,
        metrics: [
          ["Celková práce", formatMoney(summary.totalWork)],
          ["Vyplaceno Ivanovi celkem", formatMoney(summary.paidTotal)],
          ["Účtenky Ivanovi", "✅ vyrovnáno"],
          ["Zbývá doplatit za práci", formatMoney(summary.openBalance)],
          ["Dny", `${summary.workDays} pracovních záznamů`],
        ],
      };
    });
  }

  function financeOverviewCard(item) {
    const { icon, label } = splitFinanceIconLabel(item.title);
    const node = financeSummaryShell(item.tone, icon, label);
    const body = el("div", "finance-summary-body");
    body.append(el("p", "finance-card-question", item.body));
    body.append(metricList(item.metrics));
    node.append(body);
    return node;
  }

  function metricList(metrics) {
    const list = el("dl", "metric-list");
    metrics.forEach(([label, value]) => {
      const group = el("div", "metric-row");
      group.append(el("dt", "", label), el("dd", "", value));
      list.append(group);
    });
    return list;
  }

  function totalsGrid(items) {
    const totals = el("div", "finance-metric-grid");
    items.forEach(([label, amount]) => {
      totals.append(financeSummaryCard([label, toneForFinanceLabel(label), "Souhrn", amount]));
    });
    return totals;
  }

  function financeTupleMetrics(items) {
    const wrap = el("div", "finance-metric-grid");
    items.forEach((item) => wrap.append(financeSummaryCard(item)));
    return wrap;
  }

  function financeCashflowCards(rows) {
    const wrap = el("div", "finance-metric-grid");
    rows.forEach(([label, amount, body]) => {
      wrap.append(financeSummaryCard([label, toneForFinanceLabel(label), "Cashflow", amount, body]));
    });
    return wrap;
  }

  function financeSummaryCard(tuple) {
    const [label, tone, title, amount, body, icon] = tuple;
    const node = financeSummaryShell(tone, icon || defaultFinanceIcon(label, tone), label);
    const bodyNode = el("div", "finance-summary-body");
    bodyNode.append(el("h3", "", title));
    if (amount) bodyNode.append(el("p", "amount", amount));
    if (body) bodyNode.append(paragraphs(body));
    node.append(bodyNode);
    return node;
  }

  function financeSummaryShell(tone, icon, label) {
    const normalizedTone = tone || "neutral";
    const node = el("article", `finance-summary-card ${normalizedTone} tone-${normalizedTone}`.trim());
    const header = el("div", "finance-summary-header");
    header.append(el("span", "finance-summary-icon", icon || defaultFinanceIcon(label, normalizedTone)));
    header.append(el("span", "finance-summary-label", label));
    node.append(header);
    return node;
  }

  function splitFinanceIconLabel(title) {
    const value = text(title).trim();
    const match = value.match(/^(\p{Extended_Pictographic}|\S)\s+(.+)$/u);
    if (!match) return { icon: defaultFinanceIcon(value), label: value };
    return { icon: match[1], label: match[2] };
  }

  function defaultFinanceIcon(label, tone) {
    const value = text(label).toLowerCase();
    if (value.includes("celkem") || value.includes("investice")) return "▦";
    if (value.includes("cashflow") || value.includes("zaplaceno")) return "💸";
    if (value.includes("společ") || value.includes("sdílen") || value.includes("vyúčtování")) return "👥";
    if (value.includes("podíl")) return "◔";
    if (value.includes("soused")) return "🤝";
    if (value.includes("náš projekt")) return "⌂";
    if (value.includes("ivan")) return "👷";
    if (value.includes("reálně") || value.includes("náklad")) return "▣";
    if (value.includes("čeká") || value.includes("otevřené")) return "!";
    if (tone === "split") return "👥";
    if (tone === "wait") return "!";
    if (tone === "risk") return "!";
    return "▦";
  }

  function toneForFinanceLabel(label) {
    const value = text(label).toLowerCase();
    if (value.includes("čeká") || value.includes("otevřené") || value.includes("plánované") || value.includes("rozdíl") || value.includes("zbývá")) return "wait";
    if (value.includes("společ") || value.includes("sdílen") || value.includes("soused") || value.includes("löffelman")) return "split";
    if (value.includes("riziko")) return "risk";
    if (value.includes("zaplaceno") || value.includes("uhrazeno") || value.includes("potvrzené") || value.includes("celkem")) return "good";
    return "neutral";
  }

  function financeDetail(label, children, intro) {
    const details = el("details", "finance-detail");
    details.append(el("summary", "", label));
    const body = el("div", "finance-detail-body");
    if (intro) body.append(el("p", "section-intro", intro));
    children.forEach((child) => body.append(child));
    details.append(body);
    return details;
  }

  function notice(message) {
    const node = el("p", "finance-notice", message);
    return node;
  }

  function workPaymentHeaders() {
    return ["Datum", "Práce", "Parta", "Cena dne", "Stav platby", "Platba"];
  }

  function workPaymentRows() {
    return workPaymentDays().map(({ day, cost, status, allocation }) => [
      worklogDisplayDate(day),
      day.short || day.title || "Pracovní den",
      { party: `👷×${crewSizeForDay(day)}`, title: `${crewSizeForDay(day)} osob(y) Ivanovy party` },
      formatMoney(cost),
      paymentStatusCell(status),
      allocation ? `${allocation.paymentId} / ${formatMoney(allocation.amount)}` : "—",
    ]);
  }

  function workPaymentTotalRow() {
    const summary = calculateWorkTotals();
    return ["Kontrola", "celková práce − zaplaceno", "", formatMoney(summary.totalWork), paymentStatusCell(summary.openBalance > 0 ? "partial" : "paid"), formatMoney(summary.openBalance)];
  }

  function workPaymentSummaryCards() {
    const summary = calculateWorkTotals();
    return [
      ["Práce", "good", "Celková evidovaná práce", formatMoney(summary.totalWork), `${summary.workDays} pracovních záznamů v deníku.`],
      ["Platby", "good", "Celkem zaplaceno Ivanovi", formatMoney(summary.paidTotal), (data.workPaymentLedger?.payments || []).map((payment) => `${payment.date}: ${formatMoney(payment.amount)}`).join("\n")],
      ["Přiřazeno", summary.allocatedPaid ? "good" : "neutral", "Práce explicitně proplacená", formatMoney(summary.allocatedPaid), "Pouze částky spárované s konkrétním pracovním dnem."],
      ["Neproplaceno", summary.explicitUnpaid ? "risk" : "neutral", "Práce explicitně neproplacená", formatMoney(summary.explicitUnpaid), "Nezahrnuje dny, kde platba zatím není spárovaná."],
      ["Nepřiřazeno", "wait", "Platby bez přiřazení ke dnům", formatMoney(summary.unallocatedPayments), "Souhrnné platby existují, ale nejsou alokované na konkrétní dny."],
      ["Závazek", summary.openBalance ? "wait" : "good", "Účetní otevřený závazek", formatMoney(summary.openBalance), `${formatMoney(summary.totalWork)} − ${formatMoney(summary.paidTotal)}.`],
    ];
  }

  function calculateWorkTotals() {
    const days = workPaymentDays();
    const totalWork = days.reduce((sum, item) => sum + item.cost, 0);
    const payments = data.workPaymentLedger?.payments || [];
    const paidTotal = payments.reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
    const allocatedPaid = days.reduce((sum, item) => sum + Number(item.allocation?.amount || 0), 0);
    const explicitUnpaid = days.filter((item) => item.status === "unpaid").reduce((sum, item) => sum + item.cost, 0);
    const unallocatedPayments = Math.max(0, paidTotal - allocatedPaid);
    return {
      workDays: days.length,
      totalWork,
      paidTotal,
      allocatedPaid,
      explicitUnpaid,
      unallocatedPayments,
      openBalance: totalWork - paidTotal,
    };
  }

  function workPaymentDays() {
    return (data.worklog?.days || [])
      .filter((day) => day.detail?.finance && workDayCost(day) > 0)
      .sort((a, b) => worklogDateValue(a) - worklogDateValue(b))
      .map((day) => {
        const allocation = calculatePaymentAllocation(day);
        return {
          day,
          cost: workDayCost(day),
          status: day.detail?.finance?.paymentStatus || (allocation ? "paid" : data.workPaymentLedger?.defaultStatus || "unallocated"),
          allocation,
        };
      });
  }

  function workDayCost(day) {
    const finance = day.detail?.finance;
    if (!finance) return 0;
    return Number(finance.grossTotal ?? finance.total ?? 0);
  }

  function crewSizeForDay(day) {
    return (day.detail?.workers || []).length || 0;
  }

  function calculatePaymentAllocation(day) {
    const key = worklogDayKey(day);
    return (data.workPaymentLedger?.allocations || []).find((allocation) => allocation.workDayId === key || allocation.date === day.detail?.date) || null;
  }

  function paymentStatusCell(status) {
    const map = {
      paid: { badge: "✅ Proplaceno", tone: "good", title: "Pracovní den je plně pokryt konkrétní platbou." },
      partial: { badge: "🟡 Částečně", tone: "wait", title: "Pracovní den nebo celkový závazek je pokrytý jen částečně." },
      unpaid: { badge: "🔴 Neproplaceno", tone: "risk", title: "Pracovní den je výslovně označený jako neproplacený." },
      unallocated: { badge: "⚪ Nepřiřazeno", tone: "neutral", title: "Platby jsou evidované souhrnně, ale tento den není spárovaný s konkrétní platbou." },
    };
    return map[status] || map.unallocated;
  }

  function paymentStatusBadge(status) {
    const cell = paymentStatusCell(status);
    const node = el("strong", "payment-status-inline");
    const tag = el("span", `table-status-badge ${cell.tone || ""}`.trim(), cell.badge);
    if (cell.title) tag.title = cell.title;
    node.append(tag);
    return node;
  }

  function renderWorklog() {
    const section = document.querySelector("#worklog");
    const calendar = data.worklog;
    sectionTitle(section, "📒 Stavební kalendář");

    const layout = el("div", "calendar-layout");
    const panel = el("div", "calendar-panel");
    const header = el("div", "calendar-head");
    header.append(el("p", "eyebrow", "Měsíční přehled stavby"));
    header.append(el("h3", "", calendar.monthLabel));
    panel.append(header);

    const calendarGrid = el("div", "calendar-grid");

    const detail = el("article", "calendar-detail");
    const days = filteredWorklogDays(projectCalendarDays(calendar.days || []));
    const selectedDay = days.find((day) => day.selected) || days.find((day) => day.type !== "off") || days[0];

    function selectDay(day) {
      calendarGrid.querySelectorAll(".calendar-day").forEach((button) => {
        const isSelected = button.dataset.key === worklogDayKey(day);
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-expanded", String(isSelected));
      });
      renderWorklogDetail(detail, day);
    }

    let currentMonth = "";
    days.forEach((day) => {
      const monthLabel = worklogMonthLabel(day);
      if (!currentMonth) {
        currentMonth = monthLabel;
      } else if (monthLabel && monthLabel !== currentMonth) {
        currentMonth = monthLabel;
        calendarGrid.append(el("div", "calendar-month-divider", monthLabel));
      }

      const button = document.createElement("button");
      button.type = "button";
      button.className = `calendar-day type-${day.type || "off"}`;
      button.dataset.key = worklogDayKey(day);
      button.title = day.tooltip || `${day.label || day.day}. ${day.title || "Nepracovalo se"}`;
      button.setAttribute("aria-expanded", "false");
      button.append(el("span", "calendar-date", day.label || day.day));
      button.append(el("span", "calendar-marker", worklogMarker(day.type)));
      if (day.short) button.append(el("span", "calendar-short", day.short));
      calendarGrid.append(button);
    });

    calendarGrid.addEventListener("click", (event) => {
      const button = event.target.closest(".calendar-day");
      if (!button) return;
      const day = days.find((item) => worklogDayKey(item) === button.dataset.key);
      if (day) selectDay(day);
    });

    panel.append(calendarGrid);
    if (!days.length) {
      const empty = el("p", "filter-empty", "Pro vybraný projekt zatím nejsou v deníku žádné odpovídající záznamy.");
      panel.append(empty);
    }
    layout.append(panel);

    const legend = el("div", "calendar-legend");
    calendar.legend.forEach(([marker, label]) => {
      const item = el("span", "");
      item.append(el("span", "legend-marker", marker), el("span", "", label));
      legend.append(item);
    });
    layout.append(legend);
    layout.append(detail);
    section.append(layout);

    if (selectedDay) selectDay(selectedDay);
    else renderWorklogDetail(detail, { type: "off", title: "Bez záznamu", detail: { notes: "Vybraný projekt zatím nemá samostatný záznam v kalendáři." } });
  }

  function projectCalendarDays(days) {
    const orderedDays = [...days].sort((a, b) => worklogDateValue(a) - worklogDateValue(b));
    const firstProjectDay = orderedDays.findIndex((day) => day.type && day.type !== "off");
    return firstProjectDay >= 0 ? orderedDays.slice(firstProjectDay) : orderedDays;
  }

  function renderWorklogDetail(container, day) {
    const detail = day.detail || {};
    const finance = detail.finance;
    container.replaceChildren();
    container.className = `calendar-detail type-${day.type || "off"}`;
    container.append(badge(`${worklogMarker(day.type)} ${day.title || "Nepracovalo se"}`, worklogTone(day.type)));
    container.append(el("h3", "", `📅 ${worklogDisplayDate(day)}`));

    const detailGrid = el("div", "detail-grid");
    detailGrid.append(detailBlock("👷 Pracovali", listContent(detail.workers, "Nepracovalo se")));
    detailGrid.append(detailBlock("Hotovo", listContent(detail.done, day.title || "Nepracovalo se")));
    detailGrid.append(detailBlock("💰 Finance", financeContent(finance, day.type, day)));
    if (finance?.extraRows?.length) detailGrid.append(detailBlock("📋 Souhrn dne", summaryContent(finance.extraRows)));
    detailGrid.append(detailBlock("Dotčené projekty", listContent(detail.projects, "Bez vazby na aktivní projekt")));
    container.append(detailGrid);

    const notes = el("div", "detail-notes");
    notes.append(el("h4", "", "Poznámky"));
    notes.append(el("p", "", detail.notes || "Bez stavební aktivity."));
    container.append(notes);
  }

  function detailBlock(title, content) {
    const block = el("div", "detail-block");
    block.append(el("h4", "", title));
    block.append(content);
    return block;
  }

  function listContent(items, fallback) {
    const list = el("ul", "detail-list");
    const values = Array.isArray(items) && items.length ? items : [fallback];
    values.forEach((item) => list.append(el("li", "", item)));
    return list;
  }

  function financeContent(finance, type, day) {
    const wrap = el("div", "finance-list");
    if (!finance) {
      wrap.append(financeRow("Celkem", type === "off" ? "0 Kč" : "Doplnit"));
      return wrap;
    }

    if (finance.grossTotal !== undefined) {
      wrap.append(financeRow("Práce Ivanovy party za den", formatMoney(finance.grossTotal)));
      wrap.append(financeRow("Z toho náš / sdílený rozpočet", formatMoney(finance.total)));
    } else {
      wrap.append(financeRow("Celkem", formatMoney(finance.total)));
    }
    if (finance.sharedPercent) wrap.append(financeRow("Společný projekt", `${finance.sharedPercent} % / ${formatMoney(finance.sharedAmount)}`));
    if (finance.ownPercent) wrap.append(financeRow("Náš projekt", `${finance.ownPercent} % / ${formatMoney(finance.ownAmount)}`));
    if (finance.loffelmanAmount !== undefined) wrap.append(financeRow("Z toho 100 % Loffelmanovi", formatMoney(finance.loffelmanAmount)));
    if (finance.ourSharedShare !== undefined) wrap.append(financeRow("Náš podíl ze společné části", formatMoney(finance.ourSharedShare)));
    if (finance.neighborSharedShare !== undefined) wrap.append(financeRow("Podíl Lofflemanových", formatMoney(finance.neighborSharedShare)));
    if (finance.ourCost !== undefined) wrap.append(financeRow("Náš reálný náklad", formatMoney(finance.ourCost)));
    wrap.append(paymentStatusRow(day));
    return wrap;
  }

  function financeRow(label, value) {
    const row = el("div", "finance-row");
    row.append(el("span", "", label), el("strong", "", value));
    return row;
  }

  function paymentStatusRow(day) {
    const row = el("div", "finance-row payment-status-row");
    const status = paymentStatusForDay(day);
    row.append(el("span", "", "Stav úhrady práce"), paymentStatusBadge(status));
    return row;
  }

  function paymentStatusForDay(day) {
    if (!day?.detail?.finance || workDayCost(day) <= 0) return "unallocated";
    return day.detail.finance.paymentStatus || (calculatePaymentAllocation(day) ? "paid" : data.workPaymentLedger?.defaultStatus || "unallocated");
  }

  function summaryContent(rows) {
    const wrap = el("div", "summary-list");
    rows.forEach(([label, value]) => {
      const row = el("div", "summary-row");
      row.append(el("span", "", label), el("strong", "", value));
      wrap.append(row);
    });
    return wrap;
  }

  function worklogDayKey(day) {
    return day.id || `${day.detail?.date || ""}-${day.day}`;
  }

  function worklogDateValue(day) {
    const parsed = worklogDateParts(day);
    return new Date(parsed.year, parsed.month - 1, parsed.day).getTime();
  }

  function worklogMonthLabel(day) {
    const { year, month } = worklogDateParts(day);
    return `${["", "Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"][month]} ${year}`;
  }

  function worklogDisplayDate(day) {
    if (day.detail?.date) return day.detail.date;
    const { year, month, day: date } = worklogDateParts(day);
    return `${date}. ${month}. ${year}`;
  }

  function worklogDateParts(day) {
    if (day.id) {
      const [, year, month, date] = day.id.match(/^(\d{4})-(\d{2})-(\d{2})$/) || [];
      if (year) return { year: Number(year), month: Number(month), day: Number(date) };
    }

    const dateText = day.detail?.date || "";
    const [, date, month, year] = dateText.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})$/) || [];
    if (year) return { year: Number(year), month: Number(month), day: Number(date) };

    return { year: 2026, month: 6, day: Number(day.day) || 1 };
  }

  function renderProjects() {
    const section = document.querySelector("#projects");
    sectionTitle(section, "✅ Projekty", "Stavový přehled projektu. Kliknutím na kartu zapneš filtr napříč deníkem a timeline.");
    section.append(projectFilterBar());

    const board = el("div", "kanban-board");
    const columns = data.projectHub?.columns || [];
    columns.forEach(([status, label]) => {
      const column = el("section", "kanban-column");
      column.append(el("h3", "", label));
      const list = el("div", "kanban-list");
      projectHubItems()
        .filter((project) => project.status === status)
        .forEach((project) => list.append(projectKanbanCard(project)));
      column.append(list);
      board.append(column);
    });
    section.append(board);

    section.onclick = (event) => {
      const cardNode = event.target.closest(".kanban-card");
      if (!cardNode || event.target.closest("summary")) return;
      setProjectFilter(cardNode.dataset.projectId);
    };
    section.onkeydown = (event) => {
      if (!["Enter", " "].includes(event.key)) return;
      const cardNode = event.target.closest(".kanban-card");
      if (!cardNode) return;
      event.preventDefault();
      setProjectFilter(cardNode.dataset.projectId);
    };
  }

  function renderPlan() {
    const section = document.querySelector("#plan");
    sectionTitle(section, "📋 Projektový plán a master checklist");

    const progress = el("div", "progress-panel");
    const copy = el("div", "");
    copy.append(el("h3", "", "📊 Celkový stav checklistu"));
    const track = el("div", "progress-track");
    track.append(el("div", "progress-fill"));
    copy.append(track);
    copy.append(el("p", "progress-text"));
    progress.append(copy);
    progress.append(el("p", "progress-number", "0 %"));
    section.append(progress);

    section.append(
      grid(data.plan, (group) => {
        const node = el("article", "card");
        node.append(el("h3", "", group.title));
        const list = el("ul", "checklist");
        group.items.forEach(([id, label, checked]) => {
          const item = el("li", "");
          const wrapper = el("label", "");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.dataset.id = id;
          input.checked = savedChecklist[id] ?? checked;
          wrapper.append(input, el("span", "", label));
          item.append(wrapper);
          list.append(item);
        });
        node.append(list);
        return node;
      })
    );

    section.addEventListener("change", (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      saveChecklist();
      updateProgress();
    });

    updateProgress();
  }

  function renderElectricity() {
    const section = document.querySelector("#electricity");
    sectionTitle(section, "⚡ Elektřina a rozvod po zahradě");
    section.append(
      grid(data.electricity, ([label, tone, title, body]) =>
        card({ badge: label, tone, title, body })
      )
    );
  }

  function renderTimeline() {
    const section = document.querySelector("#timeline");
    sectionTitle(
      section,
      "📅 Timeline",
      "Milníkový přehled hlavních posunů projektu."
    );

    const track = el("div", "timeline-track");
    track.append(el("div", "timeline-flow"));

    const list = el("div", "timeline-milestones");
    const items = filteredTimelineItems(data.timeline || []);
    items.forEach((item) => {
      const status = item.status || "planned";
      const milestone = el("article", `timeline-item timeline-${status}`);
      milestone.append(el("span", "timeline-node"));

      const content = el("div", "timeline-content");
      content.append(el("span", "timeline-date", item.date));
      content.append(el("h3", "", `${item.icon || "•"} ${item.title}`));
      content.append(el("p", "", item.body));
      milestone.append(content);
      list.append(milestone);
    });
    if (!items.length) list.append(el("p", "filter-empty", "Pro vybraný projekt zatím nejsou v timeline žádné odpovídající milníky."));

    track.append(list);
    section.append(track);
  }

  function renderMissing() {
    const section = document.querySelector("#missing");
    sectionTitle(section, "⚠️ Co je potřeba doplnit");
    const list = el("ul", "missing-list");
    data.missing.forEach((item) => list.append(el("li", "", item)));
    section.append(list);
  }

  function globalProgressPanel() {
    const progress = calculateProgress();
    const panel = el("div", "global-progress-panel");

    const main = el("div", "global-progress-main");
    main.append(el("p", "eyebrow", "Celkový stav"));
    main.append(el("h3", "", `${progress.percent} % hotovo`));
    const track = el("div", "progress-track global-progress-track");
    const fill = el("div", "progress-fill global-progress-fill");
    fill.style.width = `${progress.percent}%`;
    track.append(fill);
    main.append(track);
    main.append(el("p", "progress-text global-progress-text", `${progress.doneTasks} / ${progress.totalTasks} checklist úkolů dokončeno`));
    panel.append(main);

    const metrics = el("div", "global-progress-metrics");
    [
      ["✅ Hotovo", `${progress.doneProjects} projektů`],
      ["🔨 Probíhá", `${progress.progressProjects} projekty`],
      ["⏳ Čeká", `${progress.waitingProjects} projekty`],
      ["📒 Poslední den", progress.lastWorkDay],
    ].forEach(([label, value]) => {
      const item = el("div", "progress-kpi");
      item.append(el("span", "", label), el("strong", "", value));
      metrics.append(item);
    });
    panel.append(metrics);
    return panel;
  }

  function projectFilterBar() {
    const bar = el("div", "project-filter-bar");
    bar.dataset.filterBar = "project";
    updateFilterBarNode(bar);
    return bar;
  }

  function updateFilterBars() {
    document.querySelectorAll('[data-filter-bar="project"]').forEach(updateFilterBarNode);
  }

  function updateFilterBarNode(bar) {
    const project = activeProject();
    bar.replaceChildren();
    bar.classList.toggle("is-active", Boolean(project));
    if (!project) {
      bar.append(el("span", "filter-muted", "Filtr projektu není aktivní."));
      return;
    }
    bar.append(el("span", "filter-label", `Aktivní filtr: ${project.emoji} ${project.title}`));
    const clear = el("button", "filter-clear", "Zrušit filtr");
    clear.type = "button";
    clear.addEventListener("click", clearProjectFilter);
    bar.append(clear);
  }

  function projectKanbanCard(project) {
    const node = el("article", `kanban-card project-status-${project.status}`);
    node.tabIndex = 0;
    node.role = "button";
    node.dataset.projectId = project.id;
    node.classList.toggle("is-active", activeProjectId === project.id);
    node.append(badge(project.status === "done" ? "Hotovo" : project.status === "progress" ? "Probíhá" : "Čeká", toneForProjectStatus(project.status)));
    node.append(el("h4", "", `${project.emoji} ${project.title}`));
    node.append(el("p", "", project.summary));
    if (project.nextStep) node.append(el("p", "next-step", `Další krok: ${project.nextStep}`));

    const source = projectSource(project);
    if (source && Array.isArray(source[1])) {
      const details = el("details", "project-card-detail");
      details.append(el("summary", "", "Detail"));
      const list = el("ul", "clean-list");
      source[1].forEach((line) => list.append(el("li", "", line)));
      details.append(list);
      node.append(details);
    }
    return node;
  }

  function projectHubItems() {
    return data.projectHub?.items || [];
  }

  function activeProject() {
    return projectHubItems().find((project) => project.id === activeProjectId);
  }

  function setProjectFilter(projectId) {
    activeProjectId = projectId;
    renderOverview();
    renderWorklog();
    renderProjects();
    renderTimeline();
    updateFilterBars();
  }

  function clearProjectFilter() {
    setProjectFilter(null);
  }

  function toneForProjectStatus(status) {
    return { done: "good", progress: "wait", waiting: "split" }[status] || "";
  }

  function projectSource(project) {
    const normalizedTitle = normalizeText(project.sourceTitle || project.title);
    return (data.projects || []).find(([title]) => normalizeText(title).includes(normalizedTitle));
  }

  function filteredWorklogDays(days) {
    const project = activeProject();
    if (!project) return days;
    return days.filter((day) => matchesProject(day, project));
  }

  function filteredTimelineItems(items) {
    const project = activeProject();
    if (!project) return items;
    return items.filter((item) => matchesProject(item, project));
  }

  function matchesProject(item, project) {
    const haystack = normalizeText(JSON.stringify(item));
    return projectSearchTerms(project).some((term) => haystack.includes(term));
  }

  function projectSearchTerms(project) {
    return [project.id, ...(project.archivedProjectIds || []), project.title, project.sourceTitle, ...(project.aliases || [])].map(normalizeText).filter(Boolean);
  }

  function normalizeText(value) {
    return text(value)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function calculateProgress() {
    const groups = data.plan || [];
    const tasks = groups.flatMap((group) => group.items || []);
    const doneTasks = tasks.filter(([id, , checked]) => savedChecklist[id] ?? checked).length;
    const totalTasks = tasks.length;
    const projects = projectHubItems();
    const lastWorkDay = [...(data.worklog?.days || [])]
      .filter((day) => day.type && day.type !== "off")
      .sort((a, b) => worklogDateValue(a) - worklogDateValue(b))
      .map(worklogDisplayDate)
      .pop() || "Bez záznamu";

    return {
      doneTasks,
      totalTasks,
      percent: totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0,
      doneProjects: projects.filter((project) => project.status === "done").length,
      progressProjects: projects.filter((project) => project.status === "progress").length,
      waitingProjects: projects.filter((project) => project.status === "waiting").length,
      lastWorkDay,
    };
  }

  function setupActiveNav() {
    const links = Array.from(document.querySelectorAll("#mainNav a"));
    const sections = links.map((link) => document.getElementById(link.dataset.section)).filter(Boolean);
    if (!sections.length || !("IntersectionObserver" in window)) return;

    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) return;
        links.forEach((link) => link.classList.toggle("is-active", link.dataset.section === visible.target.id));
      },
      { rootMargin: "-18% 0px -62% 0px", threshold: [0.05, 0.2, 0.4] }
    );
    sections.forEach((section) => observer.observe(section));
  }

  function updateProgress() {
    const plan = document.querySelector("#plan");
    const inputs = Array.from(plan.querySelectorAll('input[type="checkbox"]'));
    const checked = inputs.filter((input) => input.checked).length;
    const total = inputs.length;
    const pct = total ? Math.round((checked / total) * 100) : 0;

    plan.querySelector(".progress-fill").style.width = `${pct}%`;
    plan.querySelector(".progress-text").textContent = `${checked} / ${total} úkolů dokončeno`;
    plan.querySelector(".progress-number").textContent = `${pct} %`;

    const overviewProgress = document.querySelector(".global-progress-fill");
    const overviewText = document.querySelector(".global-progress-text");
    const overviewHeading = document.querySelector(".global-progress-main h3");
    if (overviewProgress && overviewText && overviewHeading) {
      overviewProgress.style.width = `${pct}%`;
      overviewText.textContent = `${checked} / ${total} checklist úkolů dokončeno`;
      overviewHeading.textContent = `${pct} % hotovo`;
    }
  }

  function readSavedChecklist() {
    try {
      return JSON.parse(localStorage.getItem(checklistStorageKey)) || {};
    } catch {
      return {};
    }
  }

  function saveChecklist() {
    const state = {};
    document.querySelectorAll('#plan input[type="checkbox"]').forEach((input) => {
      state[input.dataset.id] = input.checked;
    });
    localStorage.setItem(checklistStorageKey, JSON.stringify(state));
  }

  function render() {
    renderNav();
    renderOverview();
    renderRecentChanges();
    renderProjects();
    renderWorklog();
    renderFinance();
    renderPlan();
    renderDocuments();
    renderElectricity();
    renderTimeline();
    renderMissing();
  }

  document.addEventListener("DOMContentLoaded", render);
})();

  </script>
</body>
</html>
